<div class="image-trigger-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Image Trigger</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="image_trigger_enabled" class="checkbox_label" title="Show/hide the floating image trigger panel">
                <input id="image_trigger_enabled" type="checkbox" />
                <span>Show image panel</span>
            </label>
            <label for="image_trigger_mode">Default generation mode</label>
            <select id="image_trigger_mode">
                <option value="you">Character (you)</option>
                <option value="face">Portrait (face)</option>
                <option value="me">User (me)</option>
                <option value="scene">Scenario (scene)</option>
                <option value="last">Last Message (last)</option>
                <option value="raw_last">Raw Last Message</option>
                <option value="background">Background</option>
            </select>
        </div>
    </div>
</div>
